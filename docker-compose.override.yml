# Single-user default: SPEC=dflash2 CTX=long, int8 per-token-head KV at a 131,072-token
# context (perplexity +0.02% against fp8, docs/gotchas.md; 136,429-token pool in the pinned
# 5.2 GiB). Docker Compose merges this file automatically whenever no -f is given, so
# `docker compose --profile single up -d` runs it.
#
# The values below win over .env, whose MAX_LEN=262144 and KV_MEM belong to CTX=huge and
# would not boot this profile (262K does not fit a 136K pool).
#
#   docker compose -f docker-compose.yml -f docker-compose.q2_1.yml --profile single up -d
#                                                    # q2_1 / int4 KV at 262K instead
services:
  single:
    restart: "no"   # starts only on `docker compose --profile single up -d`, not with Docker Desktop
    environment:
      SPEC: dflash2
      CTX: long
      # Context and pool, settable from .env as MAX_LEN_LONG / KV_MEM_LONG (not MAX_LEN / KV_MEM,
      # which .env keeps for CTX=huge). The pool must hold MAX_LEN: ~40,926 bytes per token.
      MAX_LEN: "${MAX_LEN_LONG:-131072}"
      KV_MEM: "${KV_MEM_LONG:-5583457484}"   # the launcher's CTX=long pin
      # One request at a time (the launcher's CTX=long default is 4). The pinned pool leaves
      # little room on a card that also runs the desktop; at 4 slots the extra graphs pushed
      # ~600 MiB into WSL2 shared memory and empty-context decode fell to 57 tok/s (175 at 1).
      MAX_SEQS: "${MAX_SEQS_LONG:-1}"
      PREFIX_RETENTION: "${RETENTION_LONG-0}"  # as q2_1/alternative.sh; empty = dense
      # Split-KV verify kernel plan for the int8 cache (int8/files/.../spec_decode_attn.py):
      # BLOCK_M 32 / TILE 32 does not spill registers, the image's 64 / 32 spills 80.
      # Decode on one 3090 with all of the above: 175 tok/s empty context (4 short prompts),
      # 99 at 32K, 82 at 129K (was 57 / 13 / 4.8).
      VLLM_SPEC_ATTN_BLOCK_M: "${SPEC_BM:-32}"
      VLLM_SPEC_ATTN_TILE: "${SPEC_TILE:-32}"
      VLLM_SPEC_ATTN_NSEG: "${SPEC_NSEG:-32}"
    volumes:
      - ./int8/files/vllm/v1/attention/ops/spec_decode_attn.py:/app/venv/lib/python3.12/site-packages/vllm/v1/attention/ops/spec_decode_attn.py:ro

  llamaui:
    restart: "no"
