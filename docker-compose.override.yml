# q2_1 KV cache by default (q2_1/README.md): llama.cpp's 2.25-bit KV format on TRITON_ATTN,
# 262,144-token context on one 24 GB card. Docker Compose merges this file automatically
# whenever no -f is given, so `docker compose --profile single up -d` runs it.
#
#   KV_DTYPE=int4_per_token_head in .env            # same launcher, stock int4 KV cache
#   docker compose -f docker-compose.yml --profile single up -d   # upstream launcher, no overlay
#
# Runs q2_1/alternative.sh instead of start_qwen.sh: the pool is sized from GPU_UTIL, not
# KV_MEM/CTX, so it adapts to whatever the desktop compositor leaves free. The q2_1 vLLM
# files are bind-mounted over the image's copies (changes: q2_1/vllm-q2_1.diff).
services:
  single:
    command: ["bash", "/app/q2_1/alternative.sh"]
    environment:
      HOME: /cache
      MODEL: models/Qwen3.8-27B-W4A16-AutoRound-fast
      GPU_UTIL: ${GPU_UTIL:-0.93}
      MAX_LEN: ${MAX_LEN:-262144}
      KV_DTYPE: ${KV_DTYPE:-q2_1}
    volumes:
      - ./q2_1:/app/q2_1:ro
      - ./q2_1/files/vllm/utils/torch_utils.py:/app/venv/lib/python3.12/site-packages/vllm/utils/torch_utils.py:ro
      - ./q2_1/files/vllm/config/cache.py:/app/venv/lib/python3.12/site-packages/vllm/config/cache.py:ro
      - ./q2_1/files/vllm/v1/kv_cache_interface.py:/app/venv/lib/python3.12/site-packages/vllm/v1/kv_cache_interface.py:ro
      - ./q2_1/files/vllm/v1/attention/backends/triton_attn.py:/app/venv/lib/python3.12/site-packages/vllm/v1/attention/backends/triton_attn.py:ro
      - ./q2_1/files/vllm/v1/attention/ops/triton_reshape_and_cache_flash.py:/app/venv/lib/python3.12/site-packages/vllm/v1/attention/ops/triton_reshape_and_cache_flash.py:ro
      - ./q2_1/files/vllm/v1/attention/ops/triton_unified_attention.py:/app/venv/lib/python3.12/site-packages/vllm/v1/attention/ops/triton_unified_attention.py:ro
      - ./q2_1/files/vllm/v1/attention/ops/q2_1_per_token_head.py:/app/venv/lib/python3.12/site-packages/vllm/v1/attention/ops/q2_1_per_token_head.py:ro
